# Database configuration for SQL Server
# This file contains default settings for database connection.
# To override locally, create env/local/db.properties (not tracked by git).

# Connection string for SQL Server
# Examples:
#   Windows 認証: Server=localhost;Database=mydb;Integrated Security=true;TrustServerCertificate=true;
#   SQL Server 認証: Server=localhost;Database=mydb;User Id=sa;Password=yourpassword;TrustServerCertificate=true;
db_connection_string = Server=localhost,1433;Database=MyTodoAppDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;

# SQL Server 専用の接続文字列 (db_connection_string と同じ内容。こちらが未設定の場合は db_connection_string にフォールバック)
sqlserver_connection_string = Server=localhost,1433;Database=MyTodoAppDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;

# PostgreSQL 接続文字列
# Examples: Host=localhost;Port=5432;Database=mydb;Username=postgres;Password=yourpassword;
postgresql_connection_string = Host=localhost;Port=5432;Database=MyTodoAppDb;Username=postgres;Password=YourStrong!Passw0rd;

# Command timeout in seconds (default: 30)
db_command_timeout = 30
